<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Agent Board 离线基础版</title><style>
*{box-sizing:border-box}body{margin:0;background:#101824;color:#e9f0fa;font:15px system-ui,'Microsoft YaHei',sans-serif}button,input,select,textarea{font:inherit;color:inherit;background:#1e3047;border:1px solid #40546d;border-radius:7px;padding:9px}button{cursor:pointer}button:hover{border-color:#7dd3fc}.primary{background:#075985}header{padding:24px;border-bottom:1px solid #304056}h1{margin:0 0 8px;font-size:25px}p,small{color:#a8bbd2;line-height:1.6}.layout{display:grid;grid-template-columns:230px 1fr}aside{padding:20px;border-right:1px solid #304056;min-height:80vh}main{padding:20px;min-width:0}#projects{display:grid;gap:8px;margin:16px 0}.project{text-align:left;overflow-wrap:anywhere}.active{background:#075985}aside>button{margin-bottom:8px;width:100%}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.toolbar h2{margin:0 auto 0 0;font-size:20px;overflow-wrap:anywhere}.toolbar input{width:200px}#message{min-height:24px;margin-top:15px;color:#7dd3fc}.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:14px;overflow:auto;margin-top:20px;padding-bottom:15px}.column{background:#192435;border:1px solid #304056;border-radius:10px;padding:14px;min-height:360px}.column h3{font-size:15px;margin:0 0 15px}.card{background:#101824;border:1px solid #40546d;border-radius:8px;padding:12px;margin:10px 0;overflow-wrap:anywhere}.card h4{margin:10px 0}.card p{font-size:13px;white-space:pre-wrap;max-height:100px;overflow:auto}.card select{width:100%;font-size:12px}.actions{display:flex;gap:6px;margin-top:10px}.actions button{padding:5px;font-size:12px}.badge{color:#7dd3fc;font-size:12px}.empty{color:#a8bbd2;font-size:13px;padding:20px 0}.notice{border-top:1px solid #304056;margin-top:20px;padding-top:12px;font-size:12px}dialog{width:min(550px,95vw);border:1px solid #40546d;border-radius:12px;background:#192435;color:#e9f0fa;padding:24px}dialog::backdrop{background:#000a}label{display:block;margin-top:15px;color:#a8bbd2}dialog input,dialog textarea,dialog select{width:100%;margin-top:6px}textarea{min-height:110px}.footer{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}@media(max-width:750px){.layout{grid-template-columns:1fr}aside{min-height:auto;border-bottom:1px solid #40546d}.board{grid-template-columns:repeat(4,240px)}}
</style></head><body><header><h1>AI Agent Board <span style="font-size:14px;color:#7dd3fc">离线基础版 0.1.1</span></h1><small>无需安装 · 本地任务管理 · AI 执行尚未接入</small></header><div class="layout"><aside><button id="addProject" class="primary">＋ 新建项目</button><div id="projects"></div><button id="renameProject">重命名当前项目</button><button id="deleteProject">删除空项目</button><p class="notice">数据保存在当前浏览器。请固定文件位置，并定期导出备份。换浏览器或清理浏览器数据后，需要导入恢复。<br>离线版不读取原版数据库。</p><button id="exportRaw" hidden>导出损坏的原始数据</button></aside><main><div class="toolbar"><h2 id="projectTitle"></h2><button id="addTask" class="primary">＋ 新建任务</button><input id="search" placeholder="搜索标题或描述" aria-label="搜索任务"><select id="priorityFilter" aria-label="优先级筛选"><option value="all">全部优先级</option><option value="high">高</option><option value="medium">中</option><option value="low">低</option></select><button id="archiveToggle">查看归档</button><button id="export">导出备份</button><button id="import">导入备份</button><input id="file" type="file" accept=".json" hidden></div><div id="message" role="status" aria-live="polite"></div><div id="board" class="board"></div><small>拖动卡片或通过状态菜单流转任务。移动到“进行中”不会启动 AI。</small></main></div>
<dialog id="taskDialog"><form id="taskForm"><h2 id="dialogTitle">新建任务</h2><label for="title">标题（必填，最多200字）</label><input id="title" required maxlength="200"><label for="description">任务描述 / 验收条件</label><textarea id="description" maxlength="20000"></textarea><label for="priority">优先级</label><select id="priority"><option value="medium">中</option><option value="high">高</option><option value="low">低</option></select><label for="status">任务状态</label><select id="status"><option value="backlog">待办</option><option value="in-progress">进行中</option><option value="review">待验收</option><option value="done">已完成</option></select><div class="footer"><button id="cancelTask" type="button">取消</button><button class="primary" type="submit">保存任务</button></div></form></dialog>
<script>
'use strict';
const KEY='agentboard-portable-v1',BACKUP=KEY+'-previous';
const columns=[['backlog','待办'],['in-progress','进行中'],['review','待验收'],['done','已完成']],priorities={high:'高',medium:'中',low:'低'};
const $=id=>document.getElementById(id),uid=()=>Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,12);
let state,selected,editId=null,archived=false,snapshot=null,blocked='';
const say=s=>$('message').textContent=s;
function validate(v){
 if(!v||v.schemaVersion!==1||!Array.isArray(v.projects)||!Array.isArray(v.tasks)||v.projects.length<1||v.projects.length>1000||v.tasks.length>10000)throw Error('备份格式或数量不符合要求');
 const text=(s,n)=>typeof s==='string'&&s.length<=n,ids=new Set(),tids=new Set();
 for(const p of v.projects){if(!p||!text(p.id,100)||!p.id||ids.has(p.id)||!text(p.name,100)||!p.name.trim())throw Error('项目数据无效');ids.add(p.id)}
 for(const t of v.tasks){if(!t||!text(t.id,100)||!t.id||tids.has(t.id)||!ids.has(t.projectId)||!text(t.title,200)||!t.title.trim()||!text(t.description,20000)||!Object.prototype.hasOwnProperty.call(priorities,t.priority)||!columns.some(c=>c[0]===t.status)||typeof t.archived!=='boolean'||!Number.isFinite(t.createdAt)||!Number.isFinite(t.updatedAt))throw Error('任务数据无效');tids.add(t.id)}
 return {schemaVersion:1,projects:v.projects.map(p=>({id:p.id,name:p.name})),tasks:v.tasks.map(t=>({id:t.id,projectId:t.projectId,title:t.title,description:t.description,priority:t.priority,status:t.status,archived:t.archived,createdAt:t.createdAt,updatedAt:t.updatedAt}))};
}
function initial(){return{schemaVersion:1,projects:[{id:uid(),name:'我的开发项目'}],tasks:[]}}
function load(){try{snapshot=localStorage.getItem(KEY);state=snapshot===null?initial():validate(JSON.parse(snapshot))}catch(e){state=initial();blocked='corrupt';say('本地存储不可用或数据损坏。原数据未覆盖，请导出原始数据或导入有效备份。');$('exportRaw').hidden=false}selected=state.projects[0].id;render()}
function copy(){return JSON.parse(JSON.stringify(state))}
function commit(next,recover=false){
 if(blocked&&!(recover&&blocked==='corrupt')){say('当前禁止覆盖数据，请刷新后继续；损坏数据可导入备份恢复。');return false}
 try{const clean=validate(next),raw=JSON.stringify(clean),current=localStorage.getItem(KEY);if(current!==snapshot){blocked='stale';say('另一个窗口已修改数据，当前禁止覆盖。请刷新后继续。');return false}if(current!==null)localStorage.setItem(BACKUP,current);localStorage.setItem(KEY,raw);snapshot=raw;state=clean;blocked='';$('exportRaw').hidden=true;render();say('已保存到当前浏览器 · '+new Date().toLocaleTimeString());return true}catch(e){say('保存失败：'+e.message+'。未应用修改，请导出备份。');return false}
}
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function render(){
 if(!state.projects.some(p=>p.id===selected))selected=state.projects[0].id;
 $('projects').replaceChildren();for(const p of state.projects){const b=el('button',p.name,'project'+(p.id===selected?' active':''));b.onclick=()=>{selected=p.id;render()};$('projects').append(b)}
 $('projectTitle').textContent=state.projects.find(p=>p.id===selected).name;$('archiveToggle').textContent=archived?'返回活动任务':'查看归档';$('board').replaceChildren();
 const q=$('search').value.toLowerCase(),f=$('priorityFilter').value;
 const tasks=state.tasks.filter(t=>t.projectId===selected&&t.archived===archived&&(f==='all'||t.priority===f)&&(t.title+' '+t.description).toLowerCase().includes(q)).sort((a,b)=>({high:0,medium:1,low:2}[a.priority]-{high:0,medium:1,low:2}[b.priority])||b.updatedAt-a.updatedAt);
 for(const [id,name] of columns){const col=el('section',undefined,'column');col.dataset.status=id;const list=tasks.filter(t=>t.status===id);col.append(el('h3',name+' · '+list.length));col.ondragover=e=>e.preventDefault();col.ondrop=e=>{e.preventDefault();change(e.dataTransfer.getData('text/plain'),{status:id})};
 for(const t of list){const card=el('article',undefined,'card');card.dataset.taskId=t.id;card.draggable=true;card.ondragstart=e=>e.dataTransfer.setData('text/plain',t.id);card.append(el('span',priorities[t.priority]+'优先级','badge'),el('h4',t.title),el('p',t.description));const sel=el('select');sel.setAttribute('aria-label','任务状态：'+t.title);for(const[v,n]of columns){const o=el('option',n);o.value=v;sel.append(o)}sel.value=t.status;sel.onchange=()=>change(t.id,{status:sel.value});card.append(sel);const actions=el('div',undefined,'actions');for(const [label,fn]of[['编辑',()=>openTask(t)],[archived?'恢复':'归档',()=>change(t.id,{archived:!t.archived})],['删除',()=>{if(confirm('永久删除“'+t.title+'”？请先备份。')){const n=copy();n.tasks=n.tasks.filter(x=>x.id!==t.id);commit(n)}}]]){const b=el('button',label);b.onclick=fn;actions.append(b)}card.append(actions);col.append(card)}if(!list.length)col.append(el('p','暂无任务','empty'));$('board').append(col)}
}
function change(id,patch){const n=copy(),t=n.tasks.find(t=>t.id===id&&t.projectId===selected&&t.archived===archived);if(t){Object.assign(t,patch,{updatedAt:Date.now()});commit(n)}}
function openTask(t){editId=t?t.id:null;$('dialogTitle').textContent=t?'编辑任务':'新建任务';$('title').value=t?t.title:'';$('description').value=t?t.description:'';$('priority').value=t?t.priority:'medium';$('status').value=t?t.status:'backlog';$('taskDialog').showModal();$('title').focus()}
$('addTask').onclick=()=>openTask();$('cancelTask').onclick=()=>$('taskDialog').close();$('taskForm').onsubmit=e=>{e.preventDefault();const title=$('title').value.trim();if(!title){say('标题不能为空');return}const n=copy(),now=Date.now();let t=editId?n.tasks.find(t=>t.id===editId):null;if(!t){t={id:uid(),projectId:selected,archived:false,createdAt:now};n.tasks.push(t)}Object.assign(t,{title,description:$('description').value,priority:$('priority').value,status:$('status').value,updatedAt:now});if(commit(n))$('taskDialog').close()};
$('addProject').onclick=()=>{const name=prompt('项目名称（最多100字）');if(!name||!name.trim())return;const n=copy(),id=uid();n.projects.push({id,name:name.trim()});if(commit(n)){selected=id;render()}};
$('renameProject').onclick=()=>{const p=state.projects.find(p=>p.id===selected),name=prompt('新的项目名称',p.name);if(!name||!name.trim())return;const n=copy();n.projects.find(p=>p.id===selected).name=name.trim();commit(n)};
$('deleteProject').onclick=()=>{if(state.projects.length===1){say('至少保留一个项目');return}if(state.tasks.some(t=>t.projectId===selected)){say('项目仍有任务（含归档），请先处理任务');return}if(confirm('删除当前空项目？')){const n=copy();n.projects=n.projects.filter(p=>p.id!==selected);commit(n)}};
$('search').oninput=render;$('priorityFilter').onchange=render;$('archiveToggle').onclick=()=>{archived=!archived;render()};
function download(raw,name){const a=el('a'),url=URL.createObjectURL(new Blob([raw],{type:'application/json;charset=utf-8'}));a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
$('export').onclick=()=>{download(JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2),'agentboard-backup-'+new Date().toISOString().slice(0,10)+'.json');say('已请求下载，请确认备份下载完成')};$('exportRaw').onclick=()=>{try{download(localStorage.getItem(KEY)||'','agentboard-damaged.txt')}catch(e){say('无法读取浏览器本地存储')}};
$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{const file=$('file').files[0];if(!file)return;try{if(blocked==='stale')throw Error('另一个窗口已修改数据，请刷新后再导入');if(file.size>10*1024*1024)throw Error('备份超过10MB');const n=validate(JSON.parse(await file.text()));if(!confirm('导入将替换所有项目及任务，是否继续？建议先导出当前备份。'))return;if(commit(n,true))say('已导入 '+n.projects.length+' 个项目、'+n.tasks.length+' 个任务')}catch(e){say('导入失败：'+e.message+'。当前数据未改变。')}finally{$('file').value=''}};
window.addEventListener('storage',e=>{if(e.key===KEY||e.key===null){blocked='stale';say('另一个窗口已修改数据，此窗口暂停保存，请刷新后继续。')}});
load();
</script></body></html>
